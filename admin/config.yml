backend:
  name: git-gateway
  branch: main

local_backend: false
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://ktbmedia.eu
display_url: https://ktbmedia.eu
show_preview_links: false
logo_url: /assets/logo.png

slug:
  encoding: ascii
  clean_accents: true

# =============================================================================
# Pola są definiowane raz dla PL i lustrzanie dla EN. Struktura odpowiada
# site.json który jest mergowany z content.js po stronie klienta.
# Struktura bloku to anchory YAML - _pl_fields jest definiowane przy pl i
# referowane przy en jako <<: *pl_fields ? NIE, Decap nie ewaluuje YAML anchorów
# w niektórych wersjach. Duplikujemy ręcznie żeby mieć gwarancję.
# =============================================================================

collections:
  - name: site
    label: Strona
    label_singular: Treści strony
    delete: false
    editor:
      preview: false
    files:
      - label: Wszystkie treści strony
        name: homepage
        file: content/site.json
        format: json
        fields:
          - label: "Widoczność realizacji (wspólna dla PL i EN)"
            name: visibility
            widget: object
            collapsed: true
            fields:
              - { label: "Kategoria: Marketing 360", name: marketing, widget: boolean, default: true, required: false }
              - { label: "Kategoria: Aplikacje", name: apps, widget: boolean, default: true, required: false }
              - { label: "Kategoria: Strony WWW", name: web, widget: boolean, default: true, required: false }
              - label: Pojedyncze realizacje
                name: items
                widget: list
                allow_add: false
                collapsed: true
                summary: '{{fields.label}}'
                hint: 'Wyłącz Widoczna na stronie i opublikuj zmiany. Treść pozostaje zachowana. Zmiana obejmuje obie wersje językowe, katalog, podstronę i sitemap po wdrożeniu Netlify.'
                fields:
                  - { name: slug, widget: hidden }
                  - { label: Nazwa w panelu, name: label, widget: string }
                  - { label: Widoczna na stronie, name: visible, widget: boolean, default: true, required: false }

